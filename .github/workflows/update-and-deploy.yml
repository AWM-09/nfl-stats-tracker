name: Update NFL stats and deploy dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
      timezone: 'Europe/London'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate inline JavaScript before deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class InlineScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.scripts = []
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "script":
                      return
                  attributes = dict(attrs)
                  if "src" in attributes:
                      self.current = None
                      return
                  kind = (attributes.get("type") or "").strip().lower()
                  if kind not in ("", "text/javascript", "application/javascript", "module"):
                      self.current = None
                      return
                  self.current = {"type": kind, "parts": []}

              def handle_data(self, data):
                  if self.current is not None:
                      self.current["parts"].append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      self.scripts.append(self.current)
                      self.current = None

          pages = sorted(Path(".").glob("*.html"))
          if not pages:
              raise SystemExit("No HTML pages found in site/; refusing to deploy an empty site.")

          checked = 0
          with tempfile.TemporaryDirectory() as temp_dir:
              for page in pages:
                  parser = InlineScriptParser()
                  parser.feed(page.read_text(encoding="utf-8"))
                  for index, script in enumerate(parser.scripts, start=1):
                      source = "".join(script["parts"])
                      if not source.strip():
                          continue
                      suffix = ".mjs" if script["type"] == "module" else ".js"
                      target = Path(temp_dir) / f"{page.stem}-{index}{suffix}"
                      target.write_text(source, encoding="utf-8")
                      result = subprocess.run(
                          ["node", "--check", str(target)],
                          capture_output=True, text=True
                      )
                      if result.returncode:
                          print(f"JavaScript syntax error: {page} inline script #{index}")
                          print(result.stderr)
                          raise SystemExit(result.returncode)
                      checked += 1

          print(f"JavaScript syntax validation passed: {checked} inline script block(s) across {len(pages)} page(s).")
          PY

      - name: Test NFL Records calculations
        run: node scripts/test_records.js

      - name: Test NFL Research Lab calculations
        run: node scripts/test_research.js

      - name: Download weekly player stats for 2000–2026 (regular season and playoffs)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          download_asset() {
            local year="$1"
            local filename="$2"
            local output="data/stats_player_week_${year}.csv"
            local url

            for release in stats_player player_stats; do
              url="https://github.com/nflverse/nflverse-data/releases/download/${release}/${filename}"
              if curl --silent --show-error --fail --location --retry 2 "$url" --output "${output}.tmp"; then
                if test -s "${output}.tmp" && head -n 1 "${output}.tmp" | grep -qi 'week'; then
                  mv "${output}.tmp" "$output"
                  echo "Downloaded ${filename} for ${year}"
                  return 0
                fi
              fi
              rm -f "${output}.tmp"
            done
            return 1
          }

          for year in 2000 2001 2002 2003 2004 2005 2006 2007 2008 2009 2010 2011 2012 2013 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            echo "Downloading weekly player statistics for ${year}"
            download_asset "$year" "stats_player_week_${year}.csv" || {
              echo "::error::Could not find the weekly player-stat CSV for ${year}."
              exit 1
            }
          done

          echo "Downloading player statistics for 2025"
          if ! download_asset 2025 stats_player_week_2025.csv; then
            reg="$(mktemp)"
            post="$(mktemp)"
            got_reg=false
            got_post=false

            for release in stats_player player_stats; do
              for filename in stats_player_reg_2025.csv player_stats_reg_2025.csv; do
                url="https://github.com/nflverse/nflverse-data/releases/download/${release}/${filename}"
                if curl --silent --show-error --fail --location --retry 2 "$url" --output "$reg" && test -s "$reg"; then
                  got_reg=true
                  break 2
                fi
              done
            done

            for release in stats_player player_stats; do
              for filename in stats_player_post_2025.csv player_stats_post_2025.csv; do
                url="https://github.com/nflverse/nflverse-data/releases/download/${release}/${filename}"
                if curl --silent --show-error --fail --location --retry 2 "$url" --output "$post" && test -s "$post"; then
                  got_post=true
                  break 2
                fi
              done
            done

            if [[ "$got_reg" == true ]]; then
              cp "$reg" data/stats_player_week_2025.csv
              if [[ "$got_post" == true ]]; then
                tail -n +2 "$post" >> data/stats_player_week_2025.csv
              fi
            else
              echo "::error::Could not locate the 2025 player-stat CSV assets."
              exit 1
            fi

            rm -f "$reg" "$post"
          fi

          for year in 2000 2001 2002 2003 2004 2005 2006 2007 2008 2009 2010 2011 2012 2013 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            test -s "data/stats_player_week_${year}.csv"
            head -n 1 "data/stats_player_week_${year}.csv" | grep -qi 'week'
          done

      - name: Download and inspect Next Gen Stats passing data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          url="https://github.com/nflverse/nflverse-data/releases/download/nextgen_stats/ngs_passing.csv.gz"
          if ! curl --silent --show-error --fail --location --retry 3 "$url" --output data/ngs_passing.csv.gz; then
            echo "::warning::Next Gen Stats download URL was unavailable. Trying the uncompressed CSV."
            url="https://github.com/nflverse/nflverse-data/releases/download/nextgen_stats/ngs_passing.csv"
            curl --silent --show-error --fail --location --retry 3 "$url" --output data/ngs_passing.csv
          else
            gzip -dc data/ngs_passing.csv.gz > data/ngs_passing.csv
          fi

          test -s data/ngs_passing.csv
          echo "Downloaded NGS CSV header:"
          head -n 1 data/ngs_passing.csv
          echo "NGS columns containing time or player identifiers:"
          python3 - <<'PY'
          import csv
          with open("data/ngs_passing.csv", newline="", encoding="utf-8-sig") as f:
              headers = next(csv.reader(f))
          print([h for h in headers if any(x in h.lower() for x in
                ("time", "season", "week", "player", "team", "type"))])
          if not any(h.strip().lower() == "avg_time_to_throw" for h in headers):
              raise SystemExit("NGS CSV does not contain avg_time_to_throw")
          PY

      - name: Merge average time to throw into weekly player stats
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import re
          import unicodedata
          from pathlib import Path

          def norm(value):
              value = unicodedata.normalize("NFKD", str(value or ""))
              value = "".join(c for c in value if not unicodedata.combining(c))
              return re.sub(r"[^a-z0-9]", "", value.lower())

          def integer(value):
              try:
                  return int(float(str(value).strip()))
              except (ValueError, TypeError):
                  return None

          with open("data/ngs_passing.csv", newline="", encoding="utf-8-sig") as f:
              reader = csv.DictReader(f)
              ngs_rows = list(reader)
              ngs_headers = reader.fieldnames or []

          def find(headers, candidates):
              lookup = {h.strip().lower(): h for h in headers}
              for candidate in candidates:
                  if candidate.lower() in lookup:
                      return lookup[candidate.lower()]
              return None

          season_c = find(ngs_headers, ["season"])
          week_c = find(ngs_headers, ["week"])
          name_c = find(ngs_headers, ["player_display_name", "player_name", "player"])
          team_c = find(ngs_headers, ["team_abbr", "recent_team", "team"])
          type_c = find(ngs_headers, ["season_type", "season_type_name"])
          ttt_c = find(ngs_headers, ["avg_time_to_throw"])

          if not all([season_c, week_c, name_c, team_c, ttt_c]):
              raise SystemExit(
                  "Could not identify required columns in NGS CSV: "
                  + ", ".join(ngs_headers)
              )

          index = {}
          for row in ngs_rows:
              season = integer(row.get(season_c))
              week = integer(row.get(week_c))
              value = (row.get(ttt_c) or "").strip()
              if season is None or week is None or not value:
                  continue
              season_type = (
                  (row.get(type_c) or "").strip().upper()
                  if type_c else "REG"
              )
              key = (
                  season, week, season_type,
                  norm(row.get(name_c)), norm(row.get(team_c))
              )
              index[key] = value

          def match_value(row, season_col, week_col, name_col, team_col, type_col):
              season = integer(row.get(season_col))
              week = integer(row.get(week_col))
              if season is None or week is None or week == 0:
                  return None
              season_type = (
                  (row.get(type_col) or "").strip().upper()
                  if type_col else ("POST" if week >= 19 else "REG")
              )
              ngs_week = week - 18 if season_type == "POST" and week >= 19 else week
              return index.get((
                  season, ngs_week, season_type,
                  norm(row.get(name_col)), norm(row.get(team_col))
              ))

          total_matched = 0
          for path in sorted(Path("data").glob("stats_player_week_*.csv")):
              with path.open(newline="", encoding="utf-8-sig") as f:
                  reader = csv.DictReader(f)
                  rows = list(reader)
                  headers = reader.fieldnames or []

              def find_source(candidates):
                  return find(headers, candidates)

              season_c2 = find_source(["season"])
              week_c2 = find_source(["week"])
              name_c2 = find_source(["player_display_name", "player_name", "name"])
              team_c2 = find_source(["team_abbr", "recent_team", "team"])
              type_c2 = find_source(["season_type"])

              if not all([season_c2, week_c2, name_c2, team_c2]):
                  raise SystemExit(
                      f"Missing season/week/player/team columns in {path}: {headers}"
                  )

              if "avg_time_to_throw" not in headers:
                  headers.append("avg_time_to_throw")

              matched = 0
              for row in rows:
                  row["avg_time_to_throw"] = match_value(
                      row, season_c2, week_c2, name_c2, team_c2, type_c2
                  ) or ""
                  if row["avg_time_to_throw"]:
                      matched += 1

              with path.open("w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(f, fieldnames=headers, extrasaction="ignore")
                  writer.writeheader()
                  writer.writerows(rows)

              total_matched += matched
              print(f"{path}: matched {matched}/{len(rows)} rows")

          print(f"Total matched rows: {total_matched}")
          PY

      - name: Precompute Records index for fast browser loading
        run: node --expose-gc scripts/build-records-index.js

      - name: Download NFL schedule and scores
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/nflverse/nflverse-data/releases/download/schedules/games.csv"

          curl --silent --show-error --fail --location --retry 3 \
            "$url" --output data/schedule.csv.tmp

          test -s data/schedule.csv.tmp

          header="$(head -n 1 data/schedule.csv.tmp)"
          for column in season week gameday gametime home_team away_team; do
            if ! printf '%s\n' "$header" | grep -qE "(^|,)${column}(,|$)"; then
              echo "::error::Schedule CSV is missing required column: ${column}"
              exit 1
            fi
          done

          mv data/schedule.csv.tmp data/schedule.csv
          echo "NFL schedule downloaded successfully."
          echo "Schedule rows: $(($(wc -l < data/schedule.csv) - 1))"


      - name: Download NFL play-by-play data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          for year in 2000 2001 2002 2003 2004 2005 2006 2007 2008 2009 2010 2011 2012 2013 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            output="data/play_by_play_${year}.csv"
            url="https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${year}.csv"
            if ! curl --silent --show-error --fail --location --retry 3 "$url" --output "$output.tmp"; then
              echo "::error::Could not download NFL play-by-play data for ${year}."
              exit 1
            fi
            test -s "$output.tmp"
            mv "$output.tmp" "$output"
            echo "Downloaded play-by-play for ${year}"
          done

      - name: Calculate weekly team statistics
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_team_stats.py
          python3 scripts/build_advanced_stats.py
          for year in 2000 2001 2002 2003 2004 2005 2006 2007 2008 2009 2010 2011 2012 2013 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            test -s "data/stats_team_week_${year}.csv"
            test -s "data/advanced_team_week_${year}.csv"
          done

      - name: Prepare dashboard files
        run: |
          set -euo pipefail
          mkdir -p site/data
          cp index.html site/index.html
          cp tracker.html site/tracker.html
          cp player.html site/player.html
          cp health.html site/health.html
          cp research.html site/research.html
          test -s site/research.html
          cp favicon.svg site/favicon.svg
          test -s site/favicon.svg
          cp advanced.html site/advanced.html
          cp calendar.html site/calendar.html
          cp accuracy.html site/accuracy.html
          cp news.html site/news.html
          cp playbook.html site/playbook.html
          cp rulebook.html site/rulebook.html
          cp data/advanced_team_week_*.csv site/data/
          cp data/stats_player_week_*.csv site/data/
          cp data/records-index.json site/data/records-index.json
          test -s site/data/records-index.json
          cp data/player-index.json site/data/player-index.json
          test -s site/data/player-index.json
          cp data/stats_team_week_*.csv site/data/
          cp data/schedule.csv site/data/schedule.csv
          for year in 2000 2001 2002 2003 2004 2005 2006 2007 2008 2009 2010 2011 2012 2013 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            gzip -c "data/play_by_play_${year}.csv" > "site/data/play_by_play_${year}.csv.gz"
            test -s "site/data/play_by_play_${year}.csv.gz"
          done
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("site/tracker.html")
          html = path.read_text(encoding="utf-8")
          build_id = os.environ.get("GITHUB_RUN_ID", "records-v1")
          html, replaced = re.subn(
              r'(<meta name="nfl-stats-build" content=")[^"]*(">)',
              lambda match: match.group(1) + build_id + match.group(2),
              html, count=1
          )
          if replaced != 1:
              raise SystemExit("Could not version the dashboard build/cache key.")
          old_tab = '<button class="tab" data-view="calendar">NFL Calendar</button>'
          new_tab = '<a class="tab" href="./calendar.html">NFL Calendar &amp; Predictor ↗</a>'
          if old_tab in html:
              html = html.replace(old_tab, new_tab, 1)
              path.write_text(html, encoding="utf-8")
              print("Linked main tracker to the new calendar and predictor.")
          else:
              print("Calendar tab text was not found; leaving index.html unchanged.")
          PY

      - name: Build published data health manifest
        run: node scripts/build_site_manifest.js

      - name: Generate build metadata
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          manifest = json.loads(Path("site/data/site-manifest.json").read_text(encoding="utf-8"))
          info = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "commit": os.environ.get("BUILD_COMMIT", ""),
              "workflow_run_id": os.environ.get("BUILD_RUN_ID", ""),
              "data_seasons": "2000–2026",
              "source": "nflverse weekly player statistics, schedule and play-by-play-derived summaries",
              "play_by_play_delivery": "gzip-compressed static CSV files",
              "player_profiles": manifest.get("players_indexed", 0),
              "player_seasons": manifest.get("player_seasons", 0),
              "data_health": manifest.get("status", "unknown"),
              "files_checked": manifest.get("files_checked", 0)
          }
          Path("site/build-info.json").write_text(json.dumps(info, indent=2) + "\n", encoding="utf-8")
          print("Wrote build metadata for commit", info["commit"])
          PY

      - name: Run published site integration checks
        run: node scripts/test_site.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy dashboard
        uses: actions/deploy-pages@v4
